<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter Detector with Pause Feature</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #38bdf8;
            margin-bottom: 5px;
            font-size: 2.5rem;
        }

        p {
            color: #94a3b8;
            margin-bottom: 30px;
            text-align: center;
            max-width: 500px;
        }

        button {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(56, 189, 248, 0.4);
            margin-bottom: 20px;
        }

        button:hover {
            background-color: #7dd3fc;
            transform: scale(1.03);
        }

        /* Large Visual Display for Detected Letter */
        #focus-card {
            width: 200px;
            height: 200px;
            background-color: #1e293b;
            border: 2px solid #334155;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 6rem;
            font-weight: 800;
            color: #64748b;
            margin-bottom: 10px;
            transition: all 0.15s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        #focus-card.active {
            color: #38bdf8;
            border-color: #38bdf8;
            background-color: #0c4a6e;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.6);
            transform: scale(1.05);
        }

        /* System State Readout Text */
        #status-text {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #22c55e; /* Green when listening */
            margin-bottom: 25px;
            height: 20px;
        }

        #status-text.paused {
            color: #ef4444; /* Red when paused */
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 0.6; }
            to { opacity: 1; }
        }

        /* Real-time Bars Container */
        #label-container {
            background: #1e293b;
            padding: 20px 30px;
            border-radius: 16px;
            border: 1px solid #334155;
            min-width: 320px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .prediction-label {
            display: flex;
            flex-direction: column;
            padding: 10px 0;
        }

        .label-info {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            margin-bottom: 6px;
        }

        .class-name {
            font-weight: 600;
            color: #e2e8f0;
        }

        .class-probability {
            color: #38bdf8;
            font-weight: bold;
        }

        .progress-bar-background {
            width: 100%;
            background-color: #334155;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: #38bdf8;
            width: 0%;
            transition: width 0.05s ease-out;
        }
    </style>
</head>
<body>

    <h1>Letter Detector AI</h1>
    <p>Say <strong>A, B, C, or D</strong>. When detected above 50%, the system will lock onto it and pause briefly.</p>
    
    <button type="button" onclick="init()">Start Listening</button>
    
    <div id="focus-card">?</div>
    <div id="status-text"></div>

    <div id="label-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/audio@latest/dist/teachablemachine-audio.min.js"></script>

    <script type="text/javascript">
        const URL = "https://teachablemachine.withgoogle.com/models/Im0XO8uSz/";
        let recognizer;
        let isPaused = false; // State flag to control the brief pause

        // PAUSE CONFIGURATION: Adjust the duration here (in milliseconds)
        const PAUSE_DURATION = 1500; // 1500ms = 1.5 seconds

        async function init() {
            const checkpointURL = URL + "model.json"; 
            const metadataURL = URL + "metadata.json"; 

            document.querySelector("button").style.display = "none";
            const focusCard = document.getElementById("focus-card");
            const statusText = document.getElementById("status-text");
            focusCard.innerText = "-";
            statusText.innerText = "Listening...";

            recognizer = speechCommands.create(
                "BROWSER_FFT", 
                undefined,     
                checkpointURL,
                metadataURL
            );

            await recognizer.ensureModelLoaded();
            
            const classLabels = recognizer.wordLabels(); 
            const labelContainer = document.getElementById("label-container");
            
            // Generate visual meters
            for (let i = 0; i < classLabels.length; i++) {
                let labelDiv = document.createElement("div");
                labelDiv.className = "prediction-label";
                
                let infoDiv = document.createElement("div");
                infoDiv.className = "label-info";
                
                let nameSpan = document.createElement("span");
                nameSpan.className = "class-name";
                nameSpan.innerText = classLabels[i];
                
                let probSpan = document.createElement("span");
                probSpan.className = "class-probability";
                probSpan.innerText = "0%";
                
                let barBg = document.createElement("div");
                barBg.className = "progress-bar-background";
                
                let barFill = document.createElement("div");
                barFill.className = "progress-bar-fill";
                barFill.id = "bar-" + i;
                
                infoDiv.appendChild(nameSpan);
                infoDiv.appendChild(probSpan);
                barBg.appendChild(barFill);
                labelDiv.appendChild(infoDiv);
                labelDiv.appendChild(barBg);
                
                labelContainer.appendChild(labelDiv);
            }

            recognizer.listen(result => {
                // If the app is currently in a pause cycle, completely ignore incoming mic data
                if (isPaused) return;

                const scores = result.scores; 
                let highestScore = 0;
                let highestClass = "";

                // Update real-time UI elements
                for (let i = 0; i < classLabels.length; i++) {
                    const currentScore = scores[i];
                    const percentage = (currentScore * 100).toFixed(0);
                    
                    labelContainer.childNodes[i].querySelector('.class-probability').innerHTML = percentage + "%";
                    document.getElementById("bar-" + i).style.width = percentage + "%";
                    
                    if (currentScore > highestScore) {
                        highestScore = currentScore;
                        highestClass = classLabels[i];
                    }
                }

                // Core logic: Check if highest class is one of the target letters and hits the > 50% threshold
                const targetLetters = ['a', 'b', 'c', 'd'];
                const detectedClean = highestClass.toLowerCase().trim();

                if (highestScore > 0.50 && targetLetters.includes(detectedClean)) {
                    // 1. Trigger visual lock
                    focusCard.innerText = highestClass.toUpperCase();
                    focusCard.classList.add("active");
                    statusText.innerText = "Paused / Locked";
                    statusText.className = "paused";
                    
                    // 2. Activate pause flag to lock current tracking data
                    isPaused = true;

                    // 3. Set a timer to unlock the application after the specified time frame
                    setTimeout(() => {
                        isPaused = false;
                        focusCard.classList.remove("active");
                        statusText.innerText = "Listening...";
                        statusText.className = "";
                    }, PAUSE_DURATION);
                } else {
                    // Turn off card active styling if ambient noise or below 50%
                    focusCard.classList.remove("active");
                }

            }, {
                includeSpectrogram: false, 
                probabilityThreshold: 0.50, // Matches your requested sensitivity trigger
                invokeCallbackOnNoiseAndUnknown: true,
                overlapFactor: 0.50 
            });
        }
    </script>
</body>
</html>

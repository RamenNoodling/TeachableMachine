<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice-Controlled Trivia Quiz Game</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #38bdf8;
            margin-bottom: 5px;
            font-size: 2.2rem;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 30px;
            text-align: center;
            max-width: 500px;
        }

        /* Start / Action Controls */
        #start-btn, #lock-btn {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(56, 189, 248, 0.4);
            margin-bottom: 20px;
        }

        #start-btn:hover, #lock-btn:hover {
            background-color: #7dd3fc;
            transform: scale(1.03);
        }

        #lock-btn {
            background-color: #e2e8f0;
            color: #0f172a;
            box-shadow: 0 4px 14px rgba(255, 255, 255, 0.1);
            display: none; 
        }

        #lock-btn:hover {
            background-color: #ffffff;
        }

        /* Trivia Section Card */
        #quiz-container {
            background-color: #1e293b;
            border: 2px solid #334155;
            border-radius: 20px;
            padding: 30px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 25px;
            box-sizing: border-box;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        #quiz-container.correct {
            border-color: #22c55e;
            box-shadow: 0 0 25px rgba(34, 197, 94, 0.4);
        }

        #quiz-container.wrong {
            border-color: #ef4444;
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.4);
        }

        .question-tracker {
            color: #38bdf8;
            font-size: 0.9rem;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .question {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option {
            background-color: #0f172a;
            border: 1px solid #334155;
            padding: 14px 20px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .option.selected {
            border-color: #38bdf8;
            background-color: #0c4a6e;
            color: #38bdf8;
            font-weight: 700;
        }

        #status-text {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #22c55e;
            margin-bottom: 25px;
            height: 20px;
            text-align: center;
        }

        #status-text.paused {
            color: #ef4444;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 0.6; }
            to { opacity: 1; }
        }

        /* Visual Signal Trackers Frame */
        #label-container {
            background: #1e293b;
            padding: 15px 25px;
            border-radius: 16px;
            border: 1px solid #334155;
            min-width: 320px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .prediction-row {
            display: flex;
            flex-direction: column;
            padding: 8px 0;
        }

        .label-text {
            font-weight: 600;
            color: #e2e8f0;
            font-size: 14px;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }

        .progress-bar-background {
            width: 100%;
            background-color: #334155;
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: #38bdf8;
            width: 0%;
            transition: width 0.05s ease-out;
        }
    </style>
</head>
<body>

    <div>Teachable Machine Audio Model</div>
    <h1>Voice-Controlled Trivia Quiz</h1>
    <div class="subtitle">Say a letter clearly to preview choices. Use "Lock Answer" to check correctness.</div>
    
    <button type="button" id="start-btn" onclick="init()">Start Quiz Engine</button>
    
    <div id="quiz-container" style="display: none;">
        <div class="question-tracker" id="q-track">Question 1 of 3</div>
        <div class="question" id="q-text">Loading question...</div>
        <div class="options-list">
            <div class="option" id="option-A"><strong>A.</strong> <span id="text-A">Option A</span></div>
            <div class="option" id="option-B"><strong>B.</strong> <span id="text-B">Option B</span></div>
            <div class="option" id="option-C"><strong>C.</strong> <span id="text-C">Option C</span></div>
            <div class="option" id="option-D"><strong>D.</strong> <span id="text-D">Option D</span></div>
        </div>
    </div>

    <button type="button" id="lock-btn" onclick="lockInAnswer()">Lock Answer</button>
    <div id="status-text"></div>

    <div id="label-container" style="display: none;"></div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/speech-commands@0.4.0/dist/speech-commands.min.js"></script>

    <script type="text/javascript">
        const URL = "https://teachablemachine.withgoogle.com/models/Im0XO8uSz/";
        
        let isPaused = false;
        let selectedLetter = ""; 
        let currentQuestionIndex = 0;

        // Data array containing your entire structured quiz bank
        const quizData = [
            {
                question: "Which is NOT a plural for octopus?",
                answers: { A: "Octopodes", B: "Octopi", C: "Octopuses", D: "Octopera" },
                correct: "D",
                fact: "D is correct! Octopera is completely made up."
            },
            {
                question: "Which planet in our solar system is known as the Red Planet?",
                answers: { A: "Venus", B: "Mars", C: "Jupiter", D: "Saturn" },
                correct: "B",
                fact: "B is correct! Iron oxide on Mars' surface gives it a reddish appearance."
            },
            {
                question: "Which political organization's headquarters was broken into during the 1972 Watergate break-in?",
                answers: { A: "Republican National Committee", B: "Committee to Re-elect the President", C: "Democratic National Committee", D: "AFL-CIO" },
                correct: "C",
                fact: "C is correct! The break-in occurred at the DNC offices in the Watergate complex."
            }
        ];

        async function createModel() {
            const checkpointURL = URL + "model.json"; 
            const metadataURL = URL + "metadata.json"; 

            const recognizer = speechCommands.create(
                "BROWSER_FFT", 
                undefined, 
                checkpointURL,
                metadataURL);

            await recognizer.ensureModelLoaded();
            return recognizer;
        }

        async function init() {
            const recognizer = await createModel();
            const classLabels = recognizer.wordLabels(); 
            const labelContainer = document.getElementById("label-container");
            const statusText = document.getElementById("status-text");

            document.getElementById("start-btn").style.display = "none";
            document.getElementById("quiz-container").style.display = "block";
            document.getElementById("lock-btn").style.display = "inline-block";
            labelContainer.style.display = "block";
            
            // Draw initial question onto interface
            renderQuestion();

            labelContainer.innerHTML = "";
            for (let i = 0; i < classLabels.length; i++) {
                if (classLabels[i].toLowerCase().trim() === "background noise") continue;

                let rowDiv = document.createElement("div");
                rowDiv.className = "prediction-row";

                let textDiv = document.createElement("div");
                textDiv.className = "label-text";
                textDiv.id = "text-label-" + i;
                textDiv.innerHTML = classLabels[i] + ": 0.00";

                let barBg = document.createElement("div");
                barBg.className = "progress-bar-background";

                let barFill = document.createElement("div");
                barFill.className = "progress-bar-fill";
                barFill.id = "bar-" + i;

                rowDiv.appendChild(textDiv);
                rowDiv.appendChild(barBg);
                barBg.appendChild(barFill);
                labelContainer.appendChild(rowDiv);
            }

            recognizer.listen(result => {
                if (isPaused) return;

                const scores = result.scores; 
                let highestScore = 0;
                let highestClass = "";

                for (let i = 0; i < classLabels.length; i++) {
                    const currentScore = scores[i];
                    const labelClean = classLabels[i].toLowerCase().trim();
                    
                    if (labelClean !== "background noise") {
                        const classPrediction = classLabels[i] + ": " + currentScore.toFixed(2);
                        document.getElementById("text-label-" + i).innerHTML = classPrediction;
                        document.getElementById("bar-" + i).style.width = (currentScore * 100) + "%";
                    }

                    if (currentScore > highestScore) {
                        highestScore = currentScore;
                        highestClass = classLabels[i];
                    }
                }

                const targetLetters = ['a', 'b', 'c', 'd'];
                const detectedClean = highestClass.toLowerCase().trim();

                if (highestScore > 0.75 && targetLetters.includes(detectedClean)) {
                    selectedLetter = highestClass.toUpperCase();
                    highlightOption(selectedLetter);
                }

            }, {
                includeSpectrogram: true, 
                probabilityThreshold: 0.75, 
                invokeCallbackOnNoiseAndUnknown: true,
                overlapFactor: 0.50 
            });
        }

        // Populates target question fields dynamically using current state pointers
        function renderQuestion() {
            selectedLetter = ""; // reset frame logic
            document.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
            document.getElementById("status-text").innerText = "Listening for A, B, C, or D...";
            document.getElementById("status-text").style.color = "";
            document.getElementById("status-text").className = "";

            if (currentQuestionIndex < quizData.length) {
                const currentData = quizData[currentQuestionIndex];
                document.getElementById("q-track").innerText = `Question ${currentQuestionIndex + 1} of ${quizData.length}`;
                document.getElementById("q-text").innerText = currentData.question;
                document.getElementById("text-A").innerText = currentData.answers.A;
                document.getElementById("text-B").innerText = currentData.answers.B;
                document.getElementById("text-C").innerText = currentData.answers.C;
                document.getElementById("text-D").innerText = currentData.answers.D;
            } else {
                // End game visual cards
                document.getElementById("q-track").innerText = "Quiz Completed!";
                document.getElementById("q-text").innerText = "🎉 Congratulations! You cleared all the questions using your voice.";
                document.getElementById("options-list").style.display = "none";
                document.getElementById("lock-btn").style.display = "none";
                document.getElementById("status-text").style.display = "none";
            }
        }

        function highlightOption(letter) {
            document.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
            const activeTarget = document.getElementById("option-" + letter);
            if (activeTarget) {
                activeTarget.classList.add("selected");
            }
        }

        function lockInAnswer() {
            if (!selectedLetter || currentQuestionIndex >= quizData.length) {
                alert("Please state your choice clearly out loud first!");
                return;
            }

            if (isPaused) return; 
            isPaused = true;

            const quizContainer = document.getElementById("quiz-container");
            const statusText = document.getElementById("status-text");
            const activeQuestion = quizData[currentQuestionIndex];

            if (selectedLetter === activeQuestion.correct) {
                quizContainer.className = "correct";
                statusText.innerText = activeQuestion.fact;
                statusText.style.color = "#22c55e";

                // Advance track variable pointer index
                currentQuestionIndex++;

                // Clear layout state animations and switch cards after a 2.5s window
                setTimeout(() => {
                    isPaused = false;
                    quizContainer.className = "";
                    renderQuestion();
                }, 2500);

            } else {
                quizContainer.className = "wrong";
                statusText.innerText = `WRONG! You selected ${selectedLetter}. Try speaking another letter!`;
                statusText.style.color = "#ef4444";
                statusText.className = "paused";

                // Release engine lock but DON'T advance index so they can correct themselves
                setTimeout(() => {
                    isPaused = false;
                    quizContainer.className = "";
                    statusText.innerText = "Listening for A, B, C, or D...";
                    statusText.className = "";
                    statusText.style.color = "";
                }, 2000);
            }
        }
    </script>
</body>
</html>

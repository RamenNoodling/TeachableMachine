<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter Detector (A, B, C, D)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #38bdf8;
            margin-bottom: 5px;
            font-size: 2.5rem;
        }

        p {
            color: #94a3b8;
            margin-bottom: 30px;
            text-align: center;
            max-width: 500px;
        }

        button {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(56, 189, 248, 0.4);
            margin-bottom: 20px;
        }

        button:hover {
            background-color: #7dd3fc;
            transform: scale(1.03);
        }

        /* Large Visual Display for Detected Letter */
        #focus-card {
            width: 200px;
            height: 200px;
            background-color: #1e293b;
            border: 2px solid #334155;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 6rem;
            font-weight: 800;
            color: #64748b;
            margin-bottom: 30px;
            transition: all 0.15s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        #focus-card.active {
            color: #38bdf8;
            border-color: #38bdf8;
            background-color: #0c4a6e;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.6);
            transform: scale(1.05);
        }

        /* Real-time Bars Container */
        #label-container {
            background: #1e293b;
            padding: 20px 30px;
            border-radius: 16px;
            border: 1px solid #334155;
            min-width: 320px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .prediction-label {
            display: flex;
            flex-direction: column;
            padding: 10px 0;
        }

        .label-info {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            margin-bottom: 6px;
        }

        .class-name {
            font-weight: 600;
            color: #e2e8f0;
        }

        .class-probability {
            color: #38bdf8;
            font-weight: bold;
        }

        .progress-bar-background {
            width: 100%;
            background-color: #334155;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: #38bdf8;
            width: 0%;
            transition: width 0.1s ease-out;
        }
    </style>
</head>
<body>

    <h1>Letter Detector AI</h1>
    <p>Say <strong>A, B, C, or D</strong> out loud. Make sure you are in a quiet room for the best accuracy.</p>
    
    <button type="button" onclick="init()">Start Listening</button>
    
    <div id="focus-card">?</div>

    <div id="label-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/audio@latest/dist/teachablemachine-audio.min.js"></script>

    <script type="text/javascript">
        const URL = "https://teachablemachine.withgoogle.com/models/Im0XO8uSz/";
        let recognizer;

        async function init() {
            const checkpointURL = URL + "model.json"; 
            const metadataURL = URL + "metadata.json"; 

            // Clean up UI on start
            document.querySelector("button").style.display = "none";
            const focusCard = document.getElementById("focus-card");
            focusCard.innerText = "-";

            // Initialize audio model framework
            recognizer = speechCommands.create(
                "BROWSER_FFT", 
                undefined,     
                checkpointURL,
                metadataURL
            );

            await recognizer.ensureModelLoaded();
            
            const classLabels = recognizer.wordLabels(); 
            const labelContainer = document.getElementById("label-container");
            
            // Build the real-time feedback meters dynamically
            for (let i = 0; i < classLabels.length; i++) {
                let labelDiv = document.createElement("div");
                labelDiv.className = "prediction-label";
                
                let infoDiv = document.createElement("div");
                infoDiv.className = "label-info";
                
                let nameSpan = document.createElement("span");
                nameSpan.className = "class-name";
                nameSpan.innerText = classLabels[i];
                
                let probSpan = document.createElement("span");
                probSpan.className = "class-probability";
                probSpan.innerText = "0%";
                
                let barBg = document.createElement("div");
                barBg.className = "progress-bar-background";
                
                let barFill = document.createElement("div");
                barFill.className = "progress-bar-fill";
                barFill.id = "bar-" + i;
                
                infoDiv.appendChild(nameSpan);
                infoDiv.appendChild(probSpan);
                barBg.appendChild(barFill);
                labelDiv.appendChild(infoDiv);
                labelDiv.appendChild(barBg);
                
                labelContainer.appendChild(labelDiv);
            }

            // Continuous background audio stream processing
            recognizer.listen(result => {
                const scores = result.scores; 
                let highestScore = 0;
                let highestClass = "";

                for (let i = 0; i < classLabels.length; i++) {
                    const currentScore = scores[i];
                    const percentage = (currentScore * 100).toFixed(0);
                    
                    // Update specific row tracking elements
                    labelContainer.childNodes[i].querySelector('.class-probability').innerHTML = percentage + "%";
                    document.getElementById("bar-" + i).style.width = percentage + "%";
                    
                    // Keep track of the top sound predicted in this millisecond frame
                    if (currentScore > highestScore) {
                        highestScore = currentScore;
                        highestClass = classLabels[i];
                    }
                }

                // If the top prediction is above 85% confidence AND isn't background noise, spotlight it!
                if (highestScore > 0.85 && highestClass.toLowerCase() !== "background noise") {
                    focusCard.innerText = highestClass.toUpperCase();
                    focusCard.classList.add("active");
                } else {
                    // Turn off active glow when it returns to ambient silence
                    focusCard.classList.remove("active");
                }

            }, {
                includeSpectrogram: false, 
                probabilityThreshold: 0.70,
                invokeCallbackOnNoiseAndUnknown: true,
                overlapFactor: 0.50 
            });
        }
    </script>
</body>
</html>

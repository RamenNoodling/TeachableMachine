<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Trivia - Millionaire Edition</title>
    <style>
        body {
            font-family: 'Segoe UI', Impact, Arial, sans-serif;
            background: radial-gradient(circle, #091026 0%, #020514 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Top Title & Branding Elements */
        .brand-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand-header div {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: #38bdf8;
            font-weight: bold;
        }

        h1 {
            background: linear-gradient(to bottom, #ffffff 40%, #93c5fd 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 5px 0;
            font-size: 2.6rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
        }

        /* Central Game Board Container */
        #quiz-container {
            width: 100%;
            max-width: 850px;
            margin-bottom: 30px;
            display: none;
        }

        /* Question Banner Box */
        .question-box {
            background: linear-gradient(180deg, #0f1c3f 0%, #060d24 100%);
            border: 2px solid #1e3a8a;
            border-radius: 40px;
            padding: 30px 40px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(56, 189, 248, 0.1);
            position: relative;
            margin-bottom: 25px;
        }

        .question-tracker {
            color: #eab308;
            font-size: 0.9rem;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 0.2em;
            margin-bottom: 10px;
        }

        .question {
            font-size: 1.6rem;
            font-weight: 600;
            line-height: 1.4;
            color: #ffffff;
        }

        /* 2x2 Millionaire Answer Grid Layout */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Individual Answer Nodes */
        .option {
            background: linear-gradient(180deg, #0b1532 0%, #03081a 100%);
            border: 2px solid #1e3b8b;
            border-radius: 30px;
            padding: 18px 25px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        /* Hotkey character prefixes (e.g., A:, B:) */
        .option-prefix {
            color: #eab308;
            font-weight: bold;
            margin-right: 12px;
            letter-spacing: 0.05em;
        }

        .option-text {
            color: #f1f5f9;
        }

        /* Voice Detection Preview State */
        .option.selected {
            border-color: #3b82f6;
            background: linear-gradient(180deg, #1d4ed8 0%, #0b2574 100%);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
        }

        /* Lock State (Suspense Orange) */
        #quiz-container.locked-in .option.selected {
            border-color: #f97316;
            background: linear-gradient(180deg, #ea580c 0%, #9a3412 100%);
            box-shadow: 0 0 25px rgba(249, 115, 22, 0.6);
            animation: pulse-orange 0.5s infinite alternate;
        }

        /* Final Verdict States */
        #quiz-container.correct-verdict .option.selected {
            border-color: #22c55e;
            background: linear-gradient(180deg, #16a34a 0%, #14532d 100%) !important;
            box-shadow: 0 0 30px rgba(34, 197, 94, 0.8) !important;
            animation: none;
        }

        #quiz-container.wrong-verdict .option.selected {
            border-color: #ef4444;
            background: linear-gradient(180deg, #dc2626 0%, #7f1d1d 100%) !important;
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.8) !important;
            animation: none;
        }

        @keyframes pulse-orange {
            from { opacity: 0.8; }
            to { opacity: 1; }
        }

        /* Action Buttons styling */
        #start-btn, #lock-btn, #restart-btn {
            background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            border: 2px solid #3b82f6;
            padding: 16px 40px;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            margin-top: 10px;
        }

        #start-btn:hover, #lock-btn:hover, #restart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
        }

        #lock-btn {
            background: linear-gradient(180deg, #eab308 0%, #ca8a04 100%);
            border-color: #facc15;
            color: #000;
            display: none;
        }

        #restart-btn {
            background: linear-gradient(180deg, #10b981 0%, #059669 100%);
            border-color: #34d399;
            display: none;
        }

        /* Screen Message Readout HUD */
        #status-text {
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #38bdf8;
            margin: 20px 0;
            min-height: 24px;
            text-align: center;
            max-width: 600px;
        }

        /* Voice Calibration Panel ("The Lifeline Rack") */
        #label-container {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            border-radius: 20px;
            border: 1px solid #1e3a8a;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            display: none;
        }

        .prediction-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 0;
        }

        .label-text {
            font-weight: bold;
            color: #94a3b8;
            font-size: 0.85rem;
            width: 70px;
        }

        .progress-bar-background {
            flex-grow: 1;
            background-color: #0b1329;
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
            border: 1px solid #1e293b;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #38bdf8);
            width: 0%;
            transition: width 0.05s ease-out;
        }
    </style>
</head>
<body>

    <div class="brand-header">
        <div>Teachable Machine Audio Engine</div>
        <h1>Who Wants to Be a Trivia Master?</h1>
    </div>
    
    <button type="button" id="start-btn" onclick="init()">Let's Play</button>
    
    <div id="quiz-container">
        <div class="question-box">
            <div class="question-tracker" id="q-track">Question 1 of 6</div>
            <div class="question" id="q-text">Loading Production Frame...</div>
        </div>
        
        <div class="options-grid" id="options-block">
            <div class="option" id="option-A"><span class="option-prefix">A:</span><span class="option-text" id="text-A">...</span></div>
            <div class="option" id="option-B"><span class="option-prefix">B:</span><span class="option-text" id="text-B">...</span></div>
            <div class="option" id="option-C"><span class="option-prefix">C:</span><span class="option-text" id="text-C">...</span></div>
            <div class="option" id="option-D"><span class="option-prefix">D:</span><span class="option-text" id="text-D">...</span></div>
        </div>
    </div>

    <button type="button" id="lock-btn" onclick="lockInAnswer()">Final Answer?</button>
    <button type="button" id="restart-btn" onclick="restartQuiz()">Play Again</button>
    
    <div id="status-text"></div>
    <div id="label-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/speech-commands@0.4.0/dist/speech-commands.min.js"></script>

    <script type="text/javascript">
        const URL = "https://teachablemachine.withgoogle.com/models/Im0XO8uSz/";
        
        let isPaused = false;
        let selectedLetter = ""; 
        let currentQuestionIndex = 0;

        const quizData = [
            {
                question: "Which is NOT a plural for octopus?",
                answers: { A: "Octopodes", B: "Octopi", C: "Octopuses", D: "Octopera" },
                correct: "D",
                fact: "Correct! D is your final answer. 'Octopera' is completely fake."
            },
            {
                question: "Which planet in our solar system is known as the Red Planet?",
                answers: { A: "Venus", B: "Mars", C: "Jupiter", D: "Saturn" },
                correct: "B",
                fact: "Correct! B is your final answer. Rust on the surface gives Mars its red look."
            },
            {
                question: "Which political organization's headquarters was broken into during the 1972 Watergate scandal?",
                answers: { A: "Republican National Committee", B: "Committee to Re-elect the President", C: "Democratic National Committee", D: "AFL-CIO" },
                correct: "C",
                fact: "Correct! C is your final answer. It happened at the DNC office inside Watergate."
            },
            {
                question: "Which of the following is the simplest member of organic compounds?",
                answers: { A: "Formic acid", B: "Formaldehyde", C: "Methane", D: "Methanol" },
                correct: "C",
                fact: "Correct! C is your final answer. Methane (CH₄) is the absolute simplest layout."
            },
            {
                question: "What is the coefficient of x^3 in the binomial expansion of (2x - 3)^5?",
                answers: { A: "-1080", B: "-720", C: "720", D: "1080" },
                correct: "C",
                fact: "Correct! C is your final answer. The expansion evaluates cleanly to 720."
            },
            {
                question: "What do the eyes of Doctor T. J. Eckleburg symbolize to George Wilson?",
                answers: { A: "The watchful eyes of God", B: "The loss of innocence", C: "The eyes of the upper class", D: "A symbol of hope for the future" },
                correct: "A",
                fact: "Stunning! A is your final answer. Wilson believes those eyes are the eyes of God."
            }
        ];

        async function createModel() {
            const checkpointURL = URL + "model.json"; 
            const metadataURL = URL + "metadata.json"; 

            const recognizer = speechCommands.create(
                "BROWSER_FFT", 
                undefined, 
                checkpointURL,
                metadataURL);

            await recognizer.ensureModelLoaded();
            return recognizer;
        }

        async function init() {
            const recognizer = await createModel();
            const classLabels = recognizer.wordLabels(); 
            const labelContainer = document.getElementById("label-container");

            document.getElementById("start-btn").style.display = "none";
            document.getElementById("quiz-container").style.display = "block";
            document.getElementById("lock-btn").style.display = "inline-block";
            labelContainer.style.display = "block";
            
            renderQuestion();

            labelContainer.innerHTML = "";
            for (let i = 0; i < classLabels.length; i++) {
                if (classLabels[i].toLowerCase().trim() === "background noise") continue;

                let rowDiv = document.createElement("div");
                rowDiv.className = "prediction-row";

                let textDiv = document.createElement("div");
                textDiv.className = "label-text";
                textDiv.id = "text-label-" + i;
                textDiv.innerHTML = classLabels[i];

                let barBg = document.createElement("div");
                barBg.className = "progress-bar-background";

                let barFill = document.createElement("div");
                barFill.className = "progress-bar-fill";
                barFill.id = "bar-" + i;

                rowDiv.appendChild(textDiv);
                rowDiv.appendChild(barBg);
                barBg.appendChild(barFill);
                labelContainer.appendChild(rowDiv);
            }

            recognizer.listen(result => {
                if (isPaused) return;

                const scores = result.scores; 
                let highestScore = 0;
                let highestClass = "";

                for (let i = 0; i < classLabels.length; i++) {
                    const currentScore = scores[i];
                    const labelClean = classLabels[i].toLowerCase().trim();
                    
                    if (labelClean !== "background noise") {
                        document.getElementById("bar-" + i).style.width = (currentScore * 100) + "%";
                    }

                    if (currentScore > highestScore) {
                        highestScore = currentScore;
                        highestClass = classLabels[i];
                    }
                }

                const targetLetters = ['a', 'b', 'c', 'd'];
                const detectedClean = highestClass.toLowerCase().trim();

                if (highestScore > 0.75 && targetLetters.includes(detectedClean)) {
                    selectedLetter = highestClass.toUpperCase();
                    highlightOption(selectedLetter);
                }

            }, {
                includeSpectrogram: true, 
                probabilityThreshold: 0.75, 
                invokeCallbackOnNoiseAndUnknown: true,
                overlapFactor: 0.50 
            });
        }

        function renderQuestion() {
            selectedLetter = ""; 
            document.getElementById("quiz-container").className = ""; 
            document.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
            document.getElementById("status-text").innerText = "Speak your answer clear into the mic...";
            document.getElementById("status-text").style.color = "#38bdf8";

            if (currentQuestionIndex < quizData.length) {
                const currentData = quizData[currentQuestionIndex];
                document.getElementById("options-block").style.display = "grid";
                document.getElementById("lock-btn").style.display = "inline-block";
                document.getElementById("restart-btn").style.display = "none";

                document.getElementById("q-track").innerText = `Question ${currentQuestionIndex + 1} of ${quizData.length}`;
                document.getElementById("q-text").innerText = currentData.question;
                document.getElementById("text-A").innerText = currentData.answers.A;
                document.getElementById("text-B").innerText = currentData.answers.B;
                document.getElementById("text-C").innerText = currentData.answers.C;
                document.getElementById("text-D").innerText = currentData.answers.D;
            } else {
                document.getElementById("q-track").innerText = "Quiz Terminated";
                document.getElementById("q-text").innerText = "🏆 Incredible! You walked away with the ultimate title!";
                document.getElementById("options-block").style.display = "none";
                document.getElementById("lock-btn").style.display = "none";
                document.getElementById("status-text").style.display = "none";
                document.getElementById("restart-btn").style.display = "inline-block";
            }
        }

        function highlightOption(letter) {
            document.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
            const activeTarget = document.getElementById("option-" + letter);
            if (activeTarget) {
                activeTarget.classList.add("selected");
            }
        }

        function lockInAnswer() {
            if (!selectedLetter || currentQuestionIndex >= quizData.length) {
                alert("Please voice an option selection first before finalizing!");
                return;
            }

            if (isPaused) return; 
            isPaused = true;

            const quizContainer = document.getElementById("quiz-container");
            const statusText = document.getElementById("status-text");
            const activeQuestion = quizData[currentQuestionIndex];

            // Step 1: Engage Suspense Mode (Turn Orange)
            quizContainer.className = "locked-in";
            statusText.innerText = "Checking final answer...";
            statusText.style.color = "#f97316";

            // Step 2: Delay Reveal for dramatic tension
            setTimeout(() => {
                if (selectedLetter === activeQuestion.correct) {
                    quizContainer.className = "correct-verdict";
                    statusText.innerText = activeQuestion.fact;
                    statusText.style.color = "#22c55e";

                    currentQuestionIndex++;

                    setTimeout(() => {
                        isPaused = false;
                        renderQuestion();
                    }, 3000);

                } else {
                    quizContainer.className = "wrong-verdict";
                    statusText.innerText = `Incorrect! You lose it all on choice ${selectedLetter}. Try that question again!`;
                    statusText.style.color = "#ef4444";

                    setTimeout(() => {
                        isPaused = false;
                        quizContainer.className = "";
                        renderQuestion();
                    }, 3000);
                }
            }, 2000); // 2-second suspense window
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            isPaused = false;
            renderQuestion();
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter Detector - Teachable Machine</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #38bdf8;
            margin-bottom: 5px;
            font-size: 2.5rem;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 30px;
            text-align: center;
            max-width: 500px;
        }

        button {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(56, 189, 248, 0.4);
            margin-bottom: 20px;
        }

        button:hover {
            background-color: #7dd3fc;
            transform: scale(1.03);
        }

        /* Large Visual Display for Detected Letter */
        #focus-card {
            width: 200px;
            height: 200px;
            background-color: #1e293b;
            border: 2px solid #334155;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 6rem;
            font-weight: 800;
            color: #64748b;
            margin-bottom: 10px;
            transition: all 0.15s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        #focus-card.active {
            color: #38bdf8;
            border-color: #38bdf8;
            background-color: #0c4a6e;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.6);
            transform: scale(1.05);
        }

        /* System State Readout Text */
        #status-text {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #22c55e;
            margin-bottom: 25px;
            height: 20px;
        }

        #status-text.paused {
            color: #ef4444;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 0.6; }
            to { opacity: 1; }
        }

        /* Real-time Meter Layout mapped over your label-container */
        #label-container {
            background: #1e293b;
            padding: 20px 30px;
            border-radius: 16px;
            border: 1px solid #334155;
            min-width: 320px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .prediction-row {
            display: flex;
            flex-direction: column;
            padding: 10px 0;
        }

        .label-text {
            font-weight: 600;
            color: #e2e8f0;
            font-size: 16px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        .progress-bar-background {
            width: 100%;
            background-color: #334155;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: #38bdf8;
            width: 0%;
            transition: width 0.05s ease-out;
        }
    </style>
</head>
<body>

    <div>Teachable Machine Audio Model</div>
    <h1>Letter Detector AI</h1>
    <div class="subtitle">Say <strong>A, B, C, or D</strong>. Cross 75% probability to freeze the system briefly.</div>
    
    <button type="button" onclick="init()">Start</button>
    
    <div id="focus-card">?</div>
    <div id="status-text"></div>

    <div id="label-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/speech-commands@0.4.0/dist/speech-commands.min.js"></script>

    <script type="text/javascript">
        // The link to your model provided by Teachable Machine export panel
        const URL = "https://teachablemachine.withgoogle.com/models/Im0XO8uSz/";
        
        let isPaused = false;
        const PAUSE_DURATION = 1500; // Time in milliseconds to pause when a letter is detected

        async function createModel() {
            const checkpointURL = URL + "model.json"; // model topology
            const metadataURL = URL + "metadata.json"; // model metadata

            const recognizer = speechCommands.create(
                "BROWSER_FFT", // fourier transform type, not useful to change
                undefined, // speech commands vocabulary feature, not useful for your models
                checkpointURL,
                metadataURL);

            // check that model and metadata are loaded via HTTPS requests.
            await recognizer.ensureModelLoaded();

            return recognizer;
        }

        async function init() {
            const recognizer = await createModel();
            const classLabels = recognizer.wordLabels(); // get class labels
            const labelContainer = document.getElementById("label-container");
            const focusCard = document.getElementById("focus-card");
            const statusText = document.getElementById("status-text");

            // UI Adjustments on Start
            document.querySelector("button").style.display = "none";
            focusCard.innerText = "-";
            statusText.innerText = "Listening...";

            // Clear any old content and generate visual progress rows for each label
            labelContainer.innerHTML = "";
            for (let i = 0; i < classLabels.length; i++) {
                let rowDiv = document.createElement("div");
                rowDiv.className = "prediction-row";

                let textDiv = document.createElement("div");
                textDiv.className = "label-text";
                textDiv.id = "text-label-" + i;
                textDiv.innerHTML = classLabels[i] + ": 0.00";

                let barBg = document.createElement("div");
                barBg.className = "progress-bar-background";

                let barFill = document.createElement("div");
                barFill.className = "progress-bar-fill";
                barFill.id = "bar-" + i;

                rowDiv.appendChild(textDiv);
                rowDiv.appendChild(barBg);
                barBg.appendChild(barFill);
                labelContainer.appendChild(rowDiv);
            }

            // listen() takes two arguments:
            // 1. A callback function that is invoked anytime a word is recognized.
            // 2. A configuration object with adjustable fields
            recognizer.listen(result => {
                // If system is currently frozen in a detection pause, skip processing frame entirely
                if (isPaused) return;

                const scores = result.scores; // probability of prediction for each class
                let highestScore = 0;
                let highestClass = "";

                // render the probability scores per class
                for (let i = 0; i < classLabels.length; i++) {
                    const currentScore = scores[i];
                    
                    // Keep original raw text format requested (e.g., "A: 0.85")
                    const classPrediction = classLabels[i] + ": " + currentScore.toFixed(2);
                    document.getElementById("text-label-" + i).innerHTML = classPrediction;
                    
                    // Animate visual background bars (score * 100 turns it to a percentage width)
                    document.getElementById("bar-" + i).style.width = (currentScore * 100) + "%";

                    // Track the loudest noise in this frame
                    if (currentScore > highestScore) {
                        highestScore = currentScore;
                        highestClass = classLabels[i];
                    }
                }

                // Check if top sound hits your 50% threshold and matches one of the letters
                const targetLetters = ['a', 'b', 'c', 'd'];
                const detectedClean = highestClass.toLowerCase().trim();

                if (highestScore > 0.75 && targetLetters.includes(detectedClean)) {
                    // Activate temporary program lock flag
                    isPaused = true;

                    // Display matched letter onto the big visual display
                    focusCard.innerText = highestClass.toUpperCase();
                    focusCard.classList.add("active");
                    statusText.innerText = "Paused / Locked";
                    statusText.className = "paused";

                    // Release lock and clear screen back to listening defaults after time delay expires
                    setTimeout(() => {
                        isPaused = false;
                        focusCard.classList.remove("active");
                        statusText.innerText = "Listening...";
                        statusText.className = "";
                    }, PAUSE_DURATION);
                } else {
                    focusCard.classList.remove("active");
                }

            }, {
                includeSpectrogram: true, // in case listen should return result.spectrogram
                probabilityThreshold: 0.75, // Updated lower floor threshold to support your 75% target matches
                invokeCallbackOnNoiseAndUnknown: true,
                overlapFactor: 0.50 // probably want between 0.5 and 0.75. More info in README
            });
        }
    </script>
</body>
</html>
